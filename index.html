
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Search India account login and signup">

  <title>Login / Sign Up — Search India 🇮🇳</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-container {
      width: min(100% - 32px, 420px);
      margin: 40px auto;
      padding: 24px;
      border-radius: 16px;
      background: var(--card-bg, #ffffff);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .auth-container h1,
    .auth-container h2 {
      text-align: center;
    }

    .auth-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
    }

    .auth-form label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }

    .auth-form input {
      box-sizing: border-box;
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .password-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .password-row input {
      flex: 1;
      min-width: 0;
    }

    .password-toggle {
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f5f5f5;
      cursor: pointer;
    }

    .auth-actions {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .auth-actions button {
      width: 100%;
      min-height: 46px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #loginBtn {
      background: #1769e0;
      color: #fff;
      border: 0;
    }

    #signupBtn {
      background: transparent;
      color: #1769e0;
      border: 1px solid #1769e0;
    }

    #authStatus {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .auth-back {
      text-align: center;
      margin-top: 22px;
    }

    .auth-back a {
      color: #1769e0;
    }

    @media (max-width: 480px) {
      .auth-container {
        margin: 20px auto;
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container auth-container">

    <h1>🇮🇳 Search India</h1>
    <h2 id="authHeading">Login / Sign up</h2>

    <p class="auth-subtitle">
      अपने Search India account में प्रवेश करें
    </p>

    <form id="authForm" class="auth-form">

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        autocomplete="email"
        placeholder="अपना email लिखें"
      >

      <label for="password">Password</label>

      <div class="password-row">
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="6"
          autocomplete="current-password"
          placeholder="कम से कम 6 अक्षर"
        >

        <button
          type="button"
          id="togglePassword"
          class="password-toggle"
          aria-label="Password दिखाएँ"
          aria-pressed="false"
        >
          दिखाएँ
        </button>
      </div>

      <div class="auth-actions">
        <button type="submit" id="loginBtn">
          Login
        </button>

        <button type="button" id="signupBtn">
          Create account
        </button>
      </div>

    </form>

    <p id="authStatus" role="status" aria-live="polite"></p>

    <p class="auth-back">
      <a href="index.html">← Search India पर वापस जाएँ</a>
    </p>

  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const show = passwordInput.type === "password";

      passwordInput.type = show ? "text" : "password";
      togglePassword.textContent = show ? "छिपाएँ" : "दिखाएँ";

      togglePassword.setAttribute(
        "aria-label",
        show ? "Password छिपाएँ" : "Password दिखाएँ"
      );

      togglePassword.setAttribute(
        "aria-pressed",
        String(show)
      );
    });
  </script>

  <script type="module" src="auth.js"></script>
</body>
</html>
