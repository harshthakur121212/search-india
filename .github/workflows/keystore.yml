
name: Generate Search India Upload Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate upload keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore upload-keystore.jks \
            -alias searchindia \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Search India, OU=App, O=Search India, L=Prayagraj, ST=Uttar Pradesh, C=IN"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-india-upload-keystore
          path: upload-keystore.jks
          retention-days: 7
          if-no-files-found: error
          
